name: Debug Windows Build
on:
  workflow_dispatch:
  push:
    branches: ['fix-windows-msvc-spaces']

jobs:
  debug:
    name: x86_64-pc-windows-msvc (debug)
    runs-on: windows-latest
    env:
      TARGET: x86_64-pc-windows-msvc
      CARGO_TERM_COLOR: never
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: build tikv-jemalloc-sys only
      shell: bash
      run: |
        set -x
        cargo build -p tikv-jemalloc-sys --target "${{ env.TARGET }}" -vv 2>&1
    - name: check artifacts
      shell: bash
      run: |
        set -x
        find target -name 'jemalloc*' -o -name '*.lib' 2>/dev/null | head -30
        echo "---"
        find target/debug/build -name '*.lib' 2>/dev/null | head -20
        echo "---"
        find target -name 'output' -path '*/tikv-jemalloc-sys/*' 2>/dev/null | head -5
    - name: list build output
      shell: bash
      run: |
        set -x
        find target/debug/build -name '*.txt' -o -name '*.log' -o -name 'output' 2>/dev/null | head -20
        for f in $(find target/debug/build -name 'output' -path '*/tikv-jemalloc-sys/*' 2>/dev/null); do
          echo "=== $f ==="
          head -100 "$f"
        done
    - name: build full workspace
      shell: bash
      continue-on-error: true
      run: |
        set -x
        cargo build --target "${{ env.TARGET }}" -vv 2>&1 | tail -200
