name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - 'master'
      - 'main'
      - 'nightly'
      - 'fix-windows-msvc-spaces*'
  push:
    branches:
      - 'master'
      - 'main'
      - 'nightly'
      - 'fix-windows-msvc-spaces*'

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - name: aarch64-unknown-linux-gnu
            target: aarch64-unknown-linux-gnu
            nobgt: 0
            no_tests: 1
            tag: ubuntu-24.04-arm
          - name: x86_64-apple-darwin
            target: x86_64-apple-darwin
            nobgt: 0
            no_tests: 1
            tag: macos-15-intel
          - name: x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
            nobgt: 1
            no_tests: 1
            tag: windows-latest
          - name: x86_64-unknown-linux-gnu (nightly)
            target: x86_64-unknown-linux-gnu
            nobgt: 0
            no_tests: 0
            rust: nightly
            tag: ubuntu-latest
          - name: x86_64-unknown-linux-gnu (stable)
            target: x86_64-unknown-linux-gnu
            nobgt: 0
            no_tests: 0
            rust: stable
            tag: ubuntu-latest
          - name: aarch64-apple-darwin (stable)
            target: aarch64-apple-darwin
            nobgt: 0
            no_tests: 1
            tag: macos-latest
    runs-on: ${{ matrix.tag }}
    env:
      TARGET: ${{ matrix.target }}
      NO_JEMALLOC_TESTS: ${{ matrix.no_tests }}
      NOBGT: ${{ matrix.nobgt }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: install
      shell: bash
      run: |
        if [[ "${{ matrix.rust }}" == "nightly" ]]; then
            rustup default nightly
        fi
        rustup target add ${{ matrix.target }}
    - name: test
      run: sh ci/run.sh
  test_bench:
    name: Benchmarks using x86_64-unknown-linux-gnu (nightly)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - run: rustup default nightly
    - run: cargo test --bench roundtrip
  check:
    name: Rustfmt and Clippy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - run: rustup component add rustfmt clippy
    - run: cargo fmt --all -- --check
    - run: cargo clippy -p tikv-jemalloc-sys -- -D clippy::all
    - run: cargo clippy -p tikv-jemallocator -- -D clippy::all
    - run: cargo clippy -p tikv-jemallocator-global -- -D clippy::all
    - run: cargo clippy -p tikv-jemalloc-ctl -- -D clippy::all
    - run: env RUSTDOCFLAGS="--cfg jemallocator_docs" cargo doc --features stats,profiling,use_std
    - run: shellcheck ci/*.sh
